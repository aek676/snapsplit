services:
  mongo:
    image: mongo:7.0
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    command: server /data --console-address :9001
    ports:
      - 9000:9000
      # Web console, http://localhost:9001 with the credentials below.
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The app never creates buckets, so one run of mc seeds the dev bucket and
  # exits. Replaces the .dev/gcs seed directory the emulator used to mount.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: mc mb --ignore-existing local/snapsplit-receipts

  api:
    profiles:
      - api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: hermetic
    ports:
      - 3000:3000
    env_file: apps/api/.env
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://root:example@mongo:27017/snapsplit?authSource=admin
      CORS_ORIGIN: http://localhost:4200
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: snapsplit-receipts
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      mongo:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: user
      ME_CONFIG_BASICAUTH_PASSWORD: pass

volumes:
  mongo-data:
  minio-data:
