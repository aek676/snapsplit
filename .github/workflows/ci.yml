name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      nx-base: ${{ steps.set-shas.outputs.base }}
      nx-head: ${{ steps.set-shas.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup toolchain (mise)
        uses: jdx/mise-action@v4

      - name: Get Bun cache dir
        id: bun-cache-dir
        run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - name: Restore Bun cache
        id: bun-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.bun-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Save Bun cache
        if: steps.bun-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.bun-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        id: set-shas
        uses: nrwl/nx-set-shas@v5

      - name: Check Nx sync
        run: bunx nx sync:check

      - name: Format, lint, typecheck, test & build (affected)
        env:
          VITE_API_URL: https://api.invalid
          VITE_SITE_URL: https://snapsplit.invalid
        run: bunx nx affected -t format:check lint tsc:typecheck test test:integration build

  cd:
    needs: ci
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cd.yml
    with:
      nx-base: ${{ needs.ci.outputs.nx-base }}
      nx-head: ${{ needs.ci.outputs.nx-head }}
